name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neotix
          POSTGRES_PASSWORD: neotix_dev_password
          POSTGRES_DB: neotix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neotix" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # The test suite creates and uses a separate "<db>_test" database next to this one.
      DATABASE_URL: postgresql+psycopg://neotix:neotix_dev_password@localhost:5432/neotix
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  compose:
    # Proves the documented one-command start works from a clean checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod.example config -q
      - run: docker compose up --build -d --wait
      - run: |
          curl -fsS localhost:8080/health
          curl -fsS -c jar -H 'content-type: application/json' \
            -d '{"email":"admin@oreste.dev","password":"admin123"}' localhost:8080/api/auth/login
      - if: failure()
        run: docker compose logs

  deploy:
    # Continuous deployment: only for pushes to main, only after every job above passed, and only
    # when the repository has the DEPLOY_* variables configured (see docs/DEPLOY.md), so forks and
    # unconfigured clones just skip this job instead of failing.
    needs: [backend, frontend, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # never abort a deploy half-way
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts   # pinned host key: no trust-on-first-use
      - name: Deploy ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd '${{ vars.DEPLOY_PATH }}' && ./deploy/deploy.sh '${{ github.sha }}'"
      - name: Smoke test the public URL
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.DEPLOY_URL }}/health"
