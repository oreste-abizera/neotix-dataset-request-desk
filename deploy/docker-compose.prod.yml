# Production-style stack: HTTPS in front, nothing but 80/443 exposed, no demo users, secrets from
# an env file that is never committed. See docs/DEPLOY.md.
#
#   cp deploy/.env.prod.example deploy/.env.prod   # then edit
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build --wait
name: neotix-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neotix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: neotix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neotix -d neotix"]
      interval: 3s
      timeout: 3s
      retries: 30
    # no ports: reachable only from the api container on the private network

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://neotix:${POSTGRES_PASSWORD}@db:5432/neotix
      APP_ENV: production          # Secure cookies, API docs off, demo seed refused
      RUN_WORKER: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env.prod}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep this volume or you will re-issue on every start
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
