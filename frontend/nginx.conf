server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same origin for UI and API: no CORS, and the session cookie never crosses sites.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;       # CSV imports (API enforces its own 50 MB cap)
        proxy_read_timeout 300s;        # large imports
        proxy_buffering off;            # keeps Server-Sent Events flowing
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
