services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neotix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neotix_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-neotix}
    ports:
      - "127.0.0.1:5433:5432"   # host port 5433 so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-neotix}:${POSTGRES_PASSWORD:-neotix_dev_password}@db:5432/${POSTGRES_DB:-neotix}
      APP_ENV: ${APP_ENV:-development}
      SEED_SAMPLE_EPISODES: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
